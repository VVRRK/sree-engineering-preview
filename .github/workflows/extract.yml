name: Extract site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f deploy.done ]; then echo "No deploy marker - skipping"; exit 0; fi
          if [ ! -f deploy.py ]; then echo "No deploy script"; exit 0; fi
          python3 deploy.py
          rm -f site_part*.b64 site.tar.gz deploy.done deploy.fixes deploy.shas deploy.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract site files [skip ci]" || true
          git push || true
