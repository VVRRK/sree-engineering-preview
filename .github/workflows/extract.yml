name: Extract site
on: push
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ ! -f site_part2.b64 ]; then echo "Waiting for part 2"; exit 0; fi
          cat site_part1.b64 site_part2.b64 | base64 -d > site.tar.gz
          tar -xzf site.tar.gz
          rm -f site_part1.b64 site_part2.b64 site.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract site files [skip ci]"
          git push