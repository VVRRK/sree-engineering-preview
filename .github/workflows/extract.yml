name: Extract site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if ! ls site_part*.b64 >/dev/null 2>&1; then echo "No parts found"; exit 0; fi
          cat $(ls site_part*.b64 | sort -V) | base64 -d > site.tar.gz
          tar -xzf site.tar.gz || true
          rm -f site_part*.b64 site.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract site files [skip ci]" || true
          git push || true